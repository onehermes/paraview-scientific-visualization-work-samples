<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Visualization &amp; ParaView Work Samples</title>
  <desc id="desc">An editorial-style cover with a large title, workflow callouts, and a ParaView-inspired workspace mockup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040a12"/>
      <stop offset="50%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59c3c3"/>
      <stop offset="45%" stop-color="#7f8cff"/>
      <stop offset="100%" stop-color="#f6b26b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12243a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09111b" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10233a"/>
      <stop offset="100%" stop-color="#08111b"/>
    </linearGradient>
    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59c3c3"/>
      <stop offset="50%" stop-color="#7f8cff"/>
      <stop offset="100%" stop-color="#f6b26b"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#7f8cff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#59c3c3" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#59c3c3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#b6c9e2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#dce9f7"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #d9e8f8; letter-spacing: 2px; text-transform: uppercase; }
      .title { font: 800 72px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f7fbff; letter-spacing: -0.8px; }
      .subtitle { font: 400 24px/1.45 "Segoe UI", "Inter", Arial, sans-serif; fill: #cad9ea; }
      .pillText { font: 700 14px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #08111c; letter-spacing: 1px; }
      .label { font: 700 16px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #d7e6f4; letter-spacing: 0.8px; }
      .panelTitle { font: 700 22px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f7fbff; }
      .panelCopy { font: 400 16px/1.35 "Segoe UI", "Inter", Arial, sans-serif; fill: #c5d5e7; }
      .mini { font: 600 14px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #bcd0e4; letter-spacing: 0.4px; }
      .ui { font: 600 13px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #dbe8f6; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>
  <circle cx="1300" cy="120" r="310" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="165" cy="610" r="220" fill="#59c3c3" opacity="0.05" filter="url(#blur)"/>
  <circle cx="1505" cy="620" r="170" fill="#f6b26b" opacity="0.05" filter="url(#blur)"/>

  <path d="M110 150 C 340 110, 520 110, 690 150" fill="none" stroke="#9cc8ff" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M110 172 C 330 132, 520 132, 690 172" fill="none" stroke="#59c3c3" stroke-opacity="0.11" stroke-width="2.4"/>
  <path d="M860 148 C 1040 112, 1290 110, 1510 148" fill="none" stroke="#f6b26b" stroke-opacity="0.12" stroke-width="3"/>

  <text x="96" y="92" class="eyebrow">Scientific Visualization Portfolio</text>
  <text x="96" y="184" class="title">ParaView Work Samples</text>
  <text x="96" y="235" class="subtitle">Self-directed documentation for scalar fields, vector fields, and AI-output quality review.</text>

  <g transform="translate(96 270)">
    <rect width="268" height="40" rx="20" fill="url(#accent)" opacity="0.95"/>
    <text x="134" y="26" text-anchor="middle" class="pillText">HONEST  /  REPRODUCIBLE  /  POLISHED</text>
  </g>

  <g transform="translate(96 354)">
    <rect width="230" height="118" rx="22" fill="url(#glass)" stroke="#8fb8e8" stroke-opacity="0.18"/>
    <text x="22" y="36" class="label">ParaView</text>
    <text x="22" y="64" class="label">VTK-style datasets</text>
    <text x="22" y="92" class="label">Workflow notes and review</text>
  </g>

  <g transform="translate(352 354)">
    <rect width="230" height="118" rx="22" fill="url(#glass)" stroke="#8fb8e8" stroke-opacity="0.18"/>
    <text x="22" y="36" class="label">Contour / Slice</text>
    <text x="22" y="64" class="label">Glyph / Stream Tracer</text>
    <text x="22" y="92" class="label">Color mapping and export</text>
  </g>

  <g transform="translate(96 506)">
    <text class="mini" x="0" y="0">A premium visual needs more than decoration</text>
    <text class="panelCopy" x="0" y="30">The layout stays readable, the hierarchy is clear, and the claims stay limited to what the data supports.</text>
  </g>

  <!-- Workspace mockup -->
  <g transform="translate(700 126)">
    <rect width="820" height="520" rx="34" fill="url(#panel)" stroke="#8fb8e8" stroke-opacity="0.22"/>
    <rect x="18" y="18" width="784" height="36" rx="18" fill="#09131f" stroke="#c8d7ea" stroke-opacity="0.08"/>
    <circle cx="44" cy="36" r="6" fill="#f26b6b"/>
    <circle cx="66" cy="36" r="6" fill="#f6b26b"/>
    <circle cx="88" cy="36" r="6" fill="#59c3c3"/>
    <text x="124" y="41" class="ui">ParaView / Synthetic Field Preview</text>

    <!-- Pipeline panel -->
    <rect x="24" y="72" width="150" height="366" rx="24" fill="#0b1726" stroke="#9cc8ff" stroke-opacity="0.10"/>
    <text x="42" y="104" class="panelTitle">Pipeline</text>
    <g class="ui">
      <rect x="40" y="124" width="116" height="30" rx="10" fill="#12243a"/>
      <text x="54" y="144">Data Set</text>
      <rect x="40" y="162" width="116" height="30" rx="10" fill="#13273f"/>
      <text x="54" y="182">Slice</text>
      <rect x="40" y="200" width="116" height="30" rx="10" fill="#1a3350"/>
      <text x="54" y="220">Contour</text>
      <rect x="40" y="238" width="116" height="30" rx="10" fill="#13273f"/>
      <text x="54" y="258">Glyph</text>
      <rect x="40" y="276" width="116" height="30" rx="10" fill="#13273f"/>
      <text x="54" y="296">Export</text>
    </g>

    <!-- Render view -->
    <rect x="194" y="72" width="436" height="366" rx="24" fill="#07101a" stroke="#9cc8ff" stroke-opacity="0.10"/>
    <text x="214" y="104" class="panelTitle">Render View</text>
    <g transform="translate(214 126)">
      <rect width="392" height="262" rx="22" fill="#08111b" stroke="#9bd3ff" stroke-opacity="0.08"/>
      <circle cx="300" cy="58" r="34" fill="#59c3c3" opacity="0.10"/>
      <circle cx="220" cy="128" r="58" fill="#7f8cff" opacity="0.12"/>
      <circle cx="126" cy="178" r="32" fill="#f6b26b" opacity="0.12"/>
      <path d="M18 190 C 72 148, 118 138, 164 144 C 206 150, 242 136, 278 110 C 314 84, 346 70, 374 56" fill="none" stroke="#59c3c3" stroke-width="2.4" opacity="0.95"/>
      <path d="M18 168 C 74 126, 120 116, 164 120 C 208 124, 246 110, 282 82 C 316 54, 346 42, 374 28" fill="none" stroke="#86d9ff" stroke-width="2.4" opacity="0.95"/>
      <path d="M18 144 C 72 104, 118 96, 164 102 C 210 108, 246 96, 282 70 C 316 46, 346 34, 374 22" fill="none" stroke="#f6b26b" stroke-width="2.4" opacity="0.92"/>
      <path d="M18 214 C 74 178, 122 172, 170 178 C 214 184, 250 174, 286 150 C 322 126, 350 114, 374 94" fill="none" stroke="#7f8cff" stroke-width="2.4" opacity="0.92"/>
      <g stroke="#dfeaf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.95">
        <line x1="252" y1="192" x2="278" y2="166"/>
        <line x1="278" y1="166" x2="304" y2="140"/>
        <line x1="304" y1="140" x2="330" y2="114"/>
        <line x1="330" y1="114" x2="356" y2="88"/>
        <line x1="56" y1="226" x2="82" y2="200"/>
        <line x1="82" y1="200" x2="108" y2="174"/>
      </g>
    </g>

    <!-- Properties panel -->
    <rect x="642" y="72" width="154" height="366" rx="24" fill="#0b1726" stroke="#9cc8ff" stroke-opacity="0.10"/>
    <text x="660" y="104" class="panelTitle">Properties</text>
    <g class="ui">
      <text x="660" y="136">Scalar bar</text>
      <rect x="660" y="146" width="118" height="10" rx="5" fill="#12243a"/>
      <rect x="660" y="146" width="82" height="10" rx="5" fill="url(#legend)"/>

      <text x="660" y="186">Color map</text>
      <rect x="660" y="196" width="118" height="10" rx="5" fill="#12243a"/>
      <rect x="660" y="196" width="96" height="10" rx="5" fill="#59c3c3"/>

      <text x="660" y="236">Camera</text>
      <rect x="660" y="246" width="118" height="10" rx="5" fill="#12243a"/>
      <rect x="660" y="246" width="68" height="10" rx="5" fill="#7f8cff"/>

      <text x="660" y="286">Screenshot</text>
      <rect x="660" y="296" width="118" height="10" rx="5" fill="#12243a"/>
      <rect x="660" y="296" width="104" height="10" rx="5" fill="#f6b26b"/>
    </g>

    <!-- Status strip -->
    <rect x="24" y="456" width="772" height="42" rx="18" fill="#09131f" stroke="#c8d7ea" stroke-opacity="0.08"/>
    <text x="42" y="482" class="ui">Color by array</text>
    <text x="208" y="482" class="ui">Scalar bar visible</text>
    <text x="405" y="482" class="ui">Camera reset</text>
    <text x="566" y="482" class="ui">Export ready</text>
  </g>

  <path d="M110 668 C 390 628, 760 626, 1070 652 C 1260 668, 1400 668, 1520 642" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.85"/>
</svg>
