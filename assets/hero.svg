<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Visualization &amp; ParaView Work Samples</title>
  <desc id="desc">A polished banner with a title, scalar field card, vector field card, and review checklist card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050c17"/>
      <stop offset="48%" stop-color="#0b2035"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59c3c3"/>
      <stop offset="50%" stop-color="#7f8cff"/>
      <stop offset="100%" stop-color="#f6b26b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102339" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#09111c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="softLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59c3c3" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#59c3c3" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#7f8cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f6b26b" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7f8cff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#59c3c3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#59c3c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f6b26b" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#f6b26b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f6b26b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#a9c3df" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d7ecff"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #d9e8f8; letter-spacing: 2px; text-transform: uppercase; }
      .titleMain { font: 800 76px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f6fbff; letter-spacing: -0.4px; }
      .titleSub { font: 700 58px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f6fbff; letter-spacing: -0.3px; }
      .subtitle { font: 400 24px/1.45 "Segoe UI", "Inter", Arial, sans-serif; fill: #cad9ea; }
      .chip { font: 700 14px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #08111c; letter-spacing: 1px; }
      .cardTitle { font: 700 24px/1.1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f6fbff; }
      .cardCopy { font: 400 17px/1.4 "Segoe UI", "Inter", Arial, sans-serif; fill: #c7d7e9; }
      .miniLabel { font: 700 15px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #dce9f7; letter-spacing: 0.8px; }
      .checkText { font: 600 16px/1.2 "Segoe UI", "Inter", Arial, sans-serif; fill: #dbe8f6; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>
  <circle cx="1290" cy="118" r="290" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="180" cy="622" r="250" fill="url(#glowB)" filter="url(#blur)"/>
  <circle cx="1490" cy="620" r="170" fill="#59c3c3" opacity="0.06" filter="url(#blur)"/>

  <path d="M110 152 C 300 110, 500 110, 690 152" fill="none" stroke="#9cc8ff" stroke-opacity="0.14" stroke-width="3"/>
  <path d="M110 170 C 310 126, 500 126, 690 170" fill="none" stroke="#59c3c3" stroke-opacity="0.13" stroke-width="2.4"/>
  <path d="M910 154 C 1090 112, 1290 110, 1490 154" fill="none" stroke="#f6b26b" stroke-opacity="0.12" stroke-width="3"/>

  <text x="800" y="88" text-anchor="middle" class="eyebrow">Scientific Visualization Portfolio</text>
  <text x="800" y="182" text-anchor="middle" class="titleMain">ParaView</text>
  <text x="800" y="254" text-anchor="middle" class="titleSub">Work Samples</text>
  <text x="800" y="302" text-anchor="middle" class="subtitle">
    <tspan x="800" dy="0">Self-directed documentation for scalar fields, vector fields, and AI-output quality review.</tspan>
  </text>

  <g transform="translate(540 340)">
    <rect width="520" height="42" rx="21" fill="url(#accent)" opacity="0.95"/>
    <text x="260" y="27" text-anchor="middle" class="chip">WORKFLOW  /  REVIEW  /  REPRODUCIBILITY</text>
  </g>

  <!-- Scalar card -->
  <g transform="translate(100 420)">
    <rect width="420" height="260" rx="28" fill="url(#card)" stroke="#97bee7" stroke-opacity="0.22"/>
    <text x="28" y="44" class="cardTitle">Scalar field</text>
    <text x="28" y="72" class="cardCopy">Contours on a synthetic temperature field</text>
    <g transform="translate(28 94)">
      <rect width="364" height="132" rx="20" fill="#07111c" stroke="#9bd3ff" stroke-opacity="0.10"/>
      <circle cx="284" cy="36" r="22" fill="#59c3c3" opacity="0.18"/>
      <circle cx="184" cy="70" r="30" fill="#7f8cff" opacity="0.18"/>
      <circle cx="98" cy="96" r="24" fill="#f6b26b" opacity="0.16"/>
      <path d="M18 104 C 62 76, 92 70, 136 74 C 176 78, 206 66, 242 44 C 278 22, 312 18, 346 8" fill="none" stroke="#59c3c3" stroke-width="2.3" opacity="0.95"/>
      <path d="M18 86 C 62 62, 96 58, 134 60 C 170 62, 202 50, 238 28 C 276 8, 306 4, 346 18" fill="none" stroke="#86d9ff" stroke-width="2.3" opacity="0.95"/>
      <path d="M18 68 C 60 46, 92 42, 128 44 C 168 46, 204 34, 240 18 C 278 2, 312 0, 346 12" fill="none" stroke="#f6b26b" stroke-width="2.2" opacity="0.9"/>
      <path d="M18 120 C 62 98, 96 96, 136 100 C 178 104, 214 98, 252 80 C 292 62, 320 50, 346 34" fill="none" stroke="#7f8cff" stroke-width="2.2" opacity="0.9"/>
      <rect x="18" y="14" width="72" height="20" rx="10" fill="#59c3c3" opacity="0.92"/>
      <text x="54" y="29" text-anchor="middle" class="chip">SCALAR</text>
      <rect x="300" y="22" width="44" height="88" rx="8" fill="#0d1522" stroke="#d7ecff" stroke-opacity="0.18"/>
      <rect x="308" y="28" width="28" height="14" rx="4" fill="#59c3c3"/>
      <rect x="308" y="46" width="28" height="14" rx="4" fill="#86d9ff"/>
      <rect x="308" y="64" width="28" height="14" rx="4" fill="#7f8cff"/>
      <rect x="308" y="82" width="28" height="14" rx="4" fill="#f6b26b"/>
    </g>
    <text x="28" y="246" class="cardCopy">Slice first, then contour and color by a named scalar array.</text>
  </g>

  <!-- Vector card -->
  <g transform="translate(590 420)">
    <rect width="420" height="260" rx="28" fill="url(#card)" stroke="#97bee7" stroke-opacity="0.22"/>
    <text x="28" y="44" class="cardTitle">Vector field</text>
    <text x="28" y="72" class="cardCopy">Glyphs and streamlines for a rotational flow</text>
    <g transform="translate(28 94)">
      <rect width="364" height="132" rx="20" fill="#07111c" stroke="#9bd3ff" stroke-opacity="0.10"/>
      <circle cx="188" cy="66" r="54" fill="none" stroke="#59c3c3" stroke-width="2.4" stroke-dasharray="8 10" opacity="0.8"/>
      <circle cx="188" cy="66" r="28" fill="none" stroke="#f6b26b" stroke-width="2.2" stroke-dasharray="4 8" opacity="0.65"/>
      <g stroke="#dfeaf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.95">
        <line x1="76" y1="108" x2="110" y2="76"/>
        <line x1="108" y1="90" x2="142" y2="58"/>
        <line x1="140" y1="72" x2="172" y2="40"/>
        <line x1="176" y1="62" x2="208" y2="28"/>
        <line x1="210" y1="50" x2="242" y2="18"/>
        <line x1="244" y1="38" x2="278" y2="6"/>
        <line x1="92" y1="120" x2="126" y2="88"/>
        <line x1="126" y1="104" x2="158" y2="72"/>
        <line x1="160" y1="88" x2="192" y2="56"/>
        <line x1="194" y1="72" x2="228" y2="40"/>
        <line x1="228" y1="56" x2="262" y2="24"/>
        <line x1="262" y1="42" x2="296" y2="10"/>
      </g>
      <rect x="18" y="14" width="74" height="20" rx="10" fill="#7f8cff" opacity="0.92"/>
      <text x="55" y="29" text-anchor="middle" class="chip">VECTOR</text>
    </g>
    <text x="28" y="246" class="cardCopy">Glyph scale should be readable, and streamlines should be documented.</text>
  </g>

  <!-- Review card -->
  <g transform="translate(1080 420)">
    <rect width="420" height="260" rx="28" fill="url(#card)" stroke="#97bee7" stroke-opacity="0.22"/>
    <text x="28" y="44" class="cardTitle">Review</text>
    <text x="28" y="72" class="cardCopy">AI-output quality and reproducibility checks</text>
    <g transform="translate(28 94)">
      <rect width="364" height="132" rx="20" fill="#07111c" stroke="#9bd3ff" stroke-opacity="0.10"/>
      <rect x="18" y="16" width="80" height="20" rx="10" fill="#f6b26b" opacity="0.92"/>
      <text x="58" y="31" text-anchor="middle" class="chip">CHECK</text>
      <g fill="none" stroke="#59c3c3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34 62 l10 10 20 -22"/>
        <path d="M34 92 l10 10 20 -22"/>
        <path d="M34 122 l10 10 20 -22"/>
      </g>
      <g class="checkText">
        <text x="78" y="68">Dataset format named</text>
        <text x="78" y="98">Array selection explicit</text>
        <text x="78" y="128">Limitations stated</text>
      </g>
    </g>
    <text x="28" y="246" class="cardCopy">A good answer explains the pipeline before it tries to sound impressive.</text>
  </g>

  <path d="M 104 730 C 410 690, 760 688, 1080 708 C 1260 720, 1380 718, 1496 694" fill="none" stroke="url(#softLine)" stroke-width="4" opacity="0.85"/>
</svg>
