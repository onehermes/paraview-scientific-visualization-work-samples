<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Review Preview</title>
  <desc id="desc">A polished review preview showing a flawed AI answer and the corresponding quality checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0c2034"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12263d"/>
      <stop offset="100%" stop-color="#08111b"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f26b6b"/>
      <stop offset="100%" stop-color="#f6b26b"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f6b26b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f6b26b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b6c9e2" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow { font: 700 15px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #dbe8f6; letter-spacing: 1.8px; text-transform: uppercase; }
      .title { font: 800 56px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f7fbff; letter-spacing: -0.6px; }
      .subtitle { font: 400 20px/1.45 "Segoe UI", "Inter", Arial, sans-serif; fill: #c5d5e7; }
      .chip { font: 700 13px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #08111c; letter-spacing: 1px; }
      .panelTitle { font: 700 20px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #f7fbff; }
      .panelCopy { font: 600 15px/1.35 "Segoe UI", "Inter", Arial, sans-serif; fill: #d5e4f2; }
      .ui { font: 600 14px/1 "Segoe UI", "Inter", Arial, sans-serif; fill: #dbe8f6; }
      .warnText { font: 600 14px/1.3 "Segoe UI", "Inter", Arial, sans-serif; fill: #f3eef0; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="920" cy="110" r="220" fill="url(#glow)"/>

  <text x="70" y="72" class="eyebrow">Feature Preview</text>
  <text x="70" y="138" class="title">AI Review</text>
  <text x="70" y="174" class="subtitle">Find the missing assumptions before the workflow becomes misleading.</text>

  <g transform="translate(70 220)">
    <rect width="300" height="42" rx="21" fill="url(#warn)" opacity="0.95"/>
    <text x="150" y="27" text-anchor="middle" class="chip">ACCURACY  /  LIMITATIONS  /  REPRODUCIBILITY</text>
  </g>

  <g transform="translate(70 294)">
    <rect width="780" height="340" rx="30" fill="url(#card)" stroke="#8fb8e8" stroke-opacity="0.20"/>
    <text x="26" y="40" class="panelTitle">Review layout</text>
    <g transform="translate(26 62)">
      <rect width="400" height="250" rx="24" fill="#07111a" stroke="#9cc8ff" stroke-opacity="0.08"/>
      <text x="22" y="36" class="panelTitle">Fake AI answer</text>
      <text x="22" y="72" class="warnText">Use any dataset and add Contour, Glyph, and Stream Tracer.</text>
      <text x="22" y="104" class="warnText">Make it look scientific with stronger colors.</text>
      <text x="22" y="136" class="warnText">You can export if you want.</text>
      <rect x="22" y="164" width="356" height="58" rx="14" fill="#12263d"/>
      <text x="42" y="196" class="ui">Problems: unclear format, no array choice, no pipeline</text>
      <line x1="40" y1="74" x2="360" y2="74" stroke="#f26b6b" stroke-width="3" opacity="0.8"/>
      <line x1="40" y1="106" x2="360" y2="106" stroke="#f6b26b" stroke-width="3" opacity="0.8"/>
    </g>
    <g transform="translate(444 62)">
      <rect width="308" height="250" rx="24" fill="#0b1726" stroke="#9cc8ff" stroke-opacity="0.12"/>
      <text x="22" y="36" class="panelTitle">Review checklist</text>
      <g class="panelCopy">
        <text x="22" y="82">Format named</text>
        <text x="22" y="118">Array selected</text>
        <text x="22" y="154">Filter sequence clear</text>
        <text x="22" y="190">Export included</text>
        <text x="22" y="226">Limitations stated</text>
      </g>
      <g fill="none" stroke="#59c3c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M210 74 l8 8 16 -18"/>
        <path d="M210 110 l8 8 16 -18"/>
        <path d="M210 146 l8 8 16 -18"/>
        <path d="M210 182 l8 8 16 -18"/>
        <path d="M210 218 l8 8 16 -18"/>
      </g>
    </g>
  </g>

  <text x="70" y="674" class="panelCopy">The goal is not a louder answer. It is a clearer one with fewer hidden assumptions.</text>
</svg>
